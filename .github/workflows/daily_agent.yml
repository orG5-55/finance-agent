name: Daily Financial Agent

on:
  schedule:
    # ריצה אוטומטית בימים שני עד שישי בשעה 05:30 UTC (08:30 שעון ישראל)
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: שאיבת הקוד
        uses: actions/checkout@v4

      - name: הגדרת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: התקנת חבילות
        run: pip install -r requirements.txt

      - name: הרצת הסוכן ושליחה למייל
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python agent.py
